<!doctype html>
<body>
  <div id="output"></div>
  <script type="module">
    // Import the ESM version of the yargs module:
    import parser from 'http://127.0.0.1:8080/browser.js';

    // Grab argv / opts from the URL's query parameters:
    const params = new URLSearchParams(window.location.search);
    const argv = decodeURIComponent(params.get('argv') || '');
    let opts = {};
    try {
      const rawOpts = params.get('opts');
      if (rawOpts) {
        opts = JSON.parse(decodeURIComponent(rawOpts));
      }
    } catch (_err) {}

    // Run yargs parser in browser context:
    const parsed = parser(argv, opts);
    const output = document.getElementById('output');
    output.innerHTML = JSON.stringify(parsed);
  </script>
</body>
</html>
